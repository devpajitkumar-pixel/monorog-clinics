services:
  manorog-clinic:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: manorog-clinic-web
    restart: unless-stopped
    ports:
      - "12001:12001"
    environment:
      - NODE_ENV=production
      - PORT=12001
      - HOSTNAME=0.0.0.0
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:12001/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

