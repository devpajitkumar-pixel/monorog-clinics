# Manorog Clinic - Nginx Reverse Proxy Configuration
# Place this file in /etc/nginx/conf.d/manorog-clinic.conf or include in your main nginx.conf

upstream manorog_clinic_upstream {
    # Points to the Next.js container / host port 12001
    server 127.0.0.1:12001;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name manorogclinic.com www.manorogclinic.com localhost;

    # Maximum allowed client request body size (for forms / uploads)
    client_max_body_size 10M;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/rss+xml
        application/atom+xml
        image/svg+xml;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Next.js Static Assets Optimization (fingerprinted chunks)
    location /_next/static/ {
        proxy_pass http://manorog_clinic_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_cache_bypass $http_upgrade;

        expires 365d;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Public static files (favicon, icon.svg, robots, sitemap)
    location ~* \.(ico|svg|png|jpg|jpeg|webp|gif|txt|xml)$ {
        proxy_pass http://manorog_clinic_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        
        expires 30d;
        access_log off;
        add_header Cache-Control "public, max-age=2592000";
    }

    # Main Application Proxy
    location / {
        proxy_pass http://manorog_clinic_upstream;
        proxy_http_version 1.1;

        # WebSocket & connection headers
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';

        # Standard proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # Disable buffering for real-time streaming / SSR
        proxy_buffering off;
    }

    # Health check endpoint
    location /health {
        access_log off;
        return 200 'healthy\n';
        add_header Content-Type text/plain;
    }
}

